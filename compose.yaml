services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
      POSTGRES_USER: ${POSTGRES_USER:-tripmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripmate}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  init:
    build: .
    restart: "no"
    environment: &app-environment
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tripmate:tripmate@postgres:5432/tripmate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PREFIX: ${REDIS_PREFIX:-tm}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      SHORT_TERM_MEMORY_TTL_SECONDS: ${SHORT_TERM_MEMORY_TTL_SECONDS:-604800}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-604800}
      ACTION_CONFIRMATION_TTL_SECONDS: ${ACTION_CONFIRMATION_TTL_SECONDS:-900}
      AUTH_MODE: ${AUTH_MODE:-signed_bearer}
      AUTH_SIGNING_SECRET: ${AUTH_SIGNING_SECRET:-local-tripmate-signing-secret-change-before-deploy}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      STREAM_BATCH_SIZE: ${STREAM_BATCH_SIZE:-100}
      MAX_EVENT_ATTEMPTS: ${MAX_EVENT_ATTEMPTS:-5}
      PENDING_CLAIM_IDLE_MS: ${PENDING_CLAIM_IDLE_MS:-30000}
      STREAM_AUTO_TRIM: ${STREAM_AUTO_TRIM:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tripmate-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-0.1}
      RAG_INDEX_ALIAS: ${RAG_INDEX_ALIAS:-tm:knowledge:v1:dev:active}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      EXTERNAL_HTTP_TIMEOUT_SECONDS: ${EXTERNAL_HTTP_TIMEOUT_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "python -m app.persistence.postgres.migrate && python -m app.persistence.postgres.seed"]

  api:
    build: .
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: ${OTEL_WORKER_SERVICE_NAME:-tripmate-worker}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.agent.worker"]

volumes:
  postgres-data:
  redis-data:
