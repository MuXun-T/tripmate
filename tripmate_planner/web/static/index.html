<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripMate 行程规划工作台</title>
<meta name="description" content="TripMate：用自然语言描述出行需求，生成经官方规则校验的逐日行程。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='5' cy='17' r='3' fill='%231d5fbf'/%3E%3Ccircle cx='19' cy='7' r='3' fill='%231d5fbf'/%3E%3Cpath d='M5 17h7V7h7' fill='none' stroke='%231d5fbf' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><!-- taste-skill-ignore: Geist Mono for IDs only -->
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="主导航">
    <button class="btn ghost small close" type="button" id="menu-close" aria-label="关闭菜单">关闭</button>
    <a class="brand" href="#/new">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="17" r="3" fill="#1d5fbf"/><circle cx="19" cy="7" r="3" fill="#1d5fbf"/><path d="M5 17h7V7h7" fill="none" stroke="#1d5fbf" stroke-width="2"/></svg>
      TripMate
    </a>
    <p class="scope">本机演示账户 demo</p>
    <div class="nav">
      <a class="nav-item" href="#/new" data-nav="trip">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="3.5" cy="12" r="1.75"/><circle cx="12.5" cy="4" r="1.75"/><path d="M5.25 12H8V4h2.75"/></svg>
        行程规划
      </a>
      <a class="nav-item" href="#/prefs" data-nav="prefs">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 2.5h8v11l-4-2.75-4 2.75z"/></svg>
        长期偏好
      </a>
    </div>
    <p class="group-label" id="trips-label">最近的行程</p>
    <div class="trips" id="trips" aria-labelledby="trips-label"></div>
    <div class="engine" id="engine"></div>
  </nav>
  <div class="canvas">
    <div class="topbar">
      <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="17" r="3" fill="#1d5fbf"/><circle cx="19" cy="7" r="3" fill="#1d5fbf"/><path d="M5 17h7V7h7" fill="none" stroke="#1d5fbf" stroke-width="2"/></svg>TripMate</span>
      <button class="btn ghost small" type="button" id="menu-open" aria-controls="sidebar" aria-expanded="false">菜单</button>
    </div>
    <main id="view"></main>
  </div>
</div>
<p class="visually-hidden" role="status" aria-atomic="true" id="announce"></p>
<script src="/static/app.js"></script>
</body>
</html>
